version: "3.9"
services:
  db:
    container_name: balloons_db_1
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=backendshop
    volumes:
      - /data/postgresql/data:/var/lib/postgresql/data
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balloons_backend_1
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=backendshop;Username=postgres;Password=123456
    # Порт 5000 залишається внутрішнім, без мапінгу на хост
    volumes:
      - /root/Balloons/backend/images:/app/wwwroot/images  # Монтуємо картинки
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: balloons_frontend_1
    ports:
      - "80:80"
      - "443:443"  # Додаємо порт для HTTPS
    depends_on:
      - backend
    restart: always
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Монтуємо сертифікати
      
      
