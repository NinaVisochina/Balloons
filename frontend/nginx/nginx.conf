worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Фронтенд (balloos.in.ua)
    server {
        listen 80;
        server_name balloos.in.ua www.balloos.in.ua;

        location / {
            root /usr/share/nginx/html; # ⚠ Перевір шлях
            try_files $uri $uri/ /index.html; # SPA підтримка
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|mp4)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public";
        }

        location /api/ {
            proxy_pass http://balloons_backend_1:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://balloons_backend_1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # Бекенд (api.balloos.in.ua)
    server {
        listen 80;
        server_name api.balloos.in.ua;

        location / {
            proxy_pass http://balloons_backend_1:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
